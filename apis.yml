apis:
- aid: verto-education-mcp
  name: Verto Education MCP Server
  description: >-
    A remote Model Context Protocol endpoint served from Verto Education's own
    WordPress installation and advertised through RFC 9728 protected-resource metadata.
    Access requires an OAuth 2.0 access token carrying the single scope `mcp`; every
    anonymous JSON-RPC call returns HTTP 401, so the tool list and its input schemas
    are not publicly enumerable. No REST contract, OpenAPI or documentation accompanies
    it.
  humanURL: https://vertoeducation.org/
  baseURL: https://vertoeducation.org/wp-json/mcp/mcp-oauth-server
