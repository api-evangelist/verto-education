aid: verto-education
name: Verto Education
description: >-
  Verto Education is a US study-abroad provider, founded in 2017, that sells a first
  year of college taken overseas. Students spend one, two or three semesters in Buenos
  Aires, Prague, London, Florence or Seville, earn up to 16 US-transferable credits per
  semester through academic provider the University of New Haven, and transfer into one
  of 60+ partner colleges, in some cases with guaranteed admission. Verto runs no
  developer programme and publishes no OpenAPI, documentation portal or SDK. It does,
  however, serve a real agent surface from its own domain: a remote Model Context
  Protocol endpoint at /wp-json/mcp/mcp-oauth-server, discoverable through RFC 9728
  protected-resource metadata and fronted by an OAuth 2.0 authorization server with
  PKCE, plus a Yoast-generated llms.txt. The MCP endpoint is live but OAuth-gated -
  tools/list returns 401 anonymously - so its tool schemas cannot be enumerated without
  credentials.
