standards:
- id: oauth2
  name: OAuth 2.0 (RFC 6749)
  conforms: true
  evidence: >-
    Live authorization_code + refresh_token authorization server on the company's own
    origin. /oauth/authorize returns 400 to a parameterless GET and /oauth/token returns
    405 to GET (POST-only), i.e. both routes exist and behave as OAuth endpoints.
  source: https://vertoeducation.org/.well-known/oauth-authorization-server
- id: rfc8414
  name: OAuth 2.0 Authorization Server Metadata (RFC 8414)
  conforms: true
  evidence: >-
    /.well-known/oauth-authorization-server returns 200 application/json carrying
    issuer, authorization_endpoint, token_endpoint, revocation_endpoint,
    response_types_supported, grant_types_supported, code_challenge_methods_supported
    and scopes_supported.
  source: https://vertoeducation.org/.well-known/oauth-authorization-server
- id: rfc9728
  name: OAuth 2.0 Protected Resource Metadata (RFC 9728)
  conforms: true
  evidence: >-
    /.well-known/oauth-protected-resource returns 200 with resource,
