name: Verto Education MCP Server
description: >-
  Verto Education serves a remote Model Context Protocol endpoint from its own
  WordPress installation at https://vertoeducation.org/wp-json/mcp/mcp-oauth-server.
  It was discovered from the RFC 9728 protected-resource document at
  /.well-known/oauth-protected-resource, which names that exact URL as the protected
  resource and declares the single scope `mcp`. The endpoint is real and reachable -
  it answers, and it answers with an authorization challenge rather than a 404 - but
  every JSON-RPC method is gated: POST tools/list and POST initialize both return
  HTTP 401 {"code":"rest_not_logged_in"}. The tool list and its inputSchemas therefore
  cannot be enumerated anonymously and are NOT recorded here. Nothing below is derived
  or guessed; the tools array is deliberately empty.
