  pkce: S256
  bearer_methods_supported:
  - header
  dynamic_client_registration: >-
    No RFC 7591 registration_endpoint is advertised. The authorization server instead
    sets client_id_metadata_document_supported true, so clients identify themselves by
    a client-id metadata document URL.
tools: []
tools_note: >-
  Auth-gated. `POST {"jsonrpc":"2.0","id":1,"method":"tools/list"}` with
  Accept: application/json, text/event-stream returned HTTP 401
  {"code":"rest_not_logged_in","message":"You are not currently logged in.","data":{"status":401}}.
  The live schemas require an authenticated OAuth introspection pass. Verto publishes no
  MCP tool reference in its docs and no llms.txt tool list, so there is no unauthenticated
  fallback source for names or descriptions either.
provenance:
  platform: >-
    The endpoint lives under /wp-json/, the WordPress REST API namespace, which places
    this server in the WordPress MCP/Abilities adapter family rather than a bespoke
    build. The whole WordPress REST API on this host is login-gated: /wp-json,
    /wp-json/wp/v2, /wp-json/wp/v2/posts and /?rest_route=/ all return the same 401.
  ownership: >-
    Served from vertoeducation.org, the company's own primary domain, and the
    authorization server metadata declares issuer https://vertoeducation.org. No
    third-party or sibling-brand host is involved.
