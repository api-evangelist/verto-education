name: Verto Education Plans and Pricing
description: >-
  Verto Education sells semester study-abroad programs, not API access. There are no
  API plans, tiers, quotas or overages of any kind - the MCP endpoint the company
  serves is not a commercial product and carries no published price. What Verto does
  publish, and publishes well, is a per-location program price for each of its five
  destinations, stated on that location's own page. Those are recorded below verbatim
  so the profile reflects the company's real commercial surface rather than an empty
  file, and they are clearly marked as program tuition.
